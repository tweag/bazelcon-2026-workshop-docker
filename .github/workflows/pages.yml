name: pages

# Build the Slidev deck and publish it to GitHub Pages.
# A repo admin sets Settings → Pages → Source = "GitHub Actions" once: the
# workflow can't do it, because enabling Pages needs a token other than
# GITHUB_TOKEN (see actions/configure-pages `enablement`).

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions required by actions/deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer pushes supersede in-flight ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Only the upstream repo publishes. Attendee forks push to `main` too, but
    # have no Pages site — skip there (and so skip deploy via `needs`).
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Build deck with the project base path
        working-directory: slides
        run: |
          npm ci
          npx slidev build \
            --base "/${GITHUB_REPOSITORY#*/}/" \
            --out dist
          touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v5
        with:
          path: slides/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
