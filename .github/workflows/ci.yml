name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  bazel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # A hosted runner has ~14 GB free and ships ~25 GB of toolchains this
      # workshop never touches. Building every sample and lab image — each a
      # ~80–700 MB tarball on top of its layers — fills the disk, and when it goes
      # the runner dies before it can write a single log line: the failure
      # arrives as a job with no output at all and a `No space left on device`
      # annotation. So reclaim the space, and stop the disk cache from keeping
      # a second copy of every output — .bazelrc line 16 asks CI to do exactly
      # that, and until now nothing did.
      - name: Make room on the runner
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/.ghcup /usr/share/swift
          echo "build --disk_cache=" >> ~/.bazelrc
          df -h /

      - name: Install system deps (dot for the graph demo)
        run: sudo apt-get update && sudo apt-get install -y graphviz

      # Bazelisk ships on GitHub runners and reads .bazelversion.
      #
      # Deliberately NOT `//...`: that pulls the Node toolchain (116 MB) and the
      # npm graph in to build the deck, which this job does not need. Measured:
      # //... loads 1,668 packages / 20,107 targets; the patterns below load 753
      # / 7,749. The hermetic deck build still runs — in the `slides` job, which
      # already pays for Node.
      - name: Build everything except the deck
        run: |
          bazel build //samples/... //labs/... //benchmark/... //tools/... //slides:srcs

      - name: Test everything except the deck (TASK §5.1)
        run: |
          bazel test //samples/... //labs/... //benchmark/... //tools/... //slides:srcs \
            --test_output=errors

      # TASK §5.3 — the self-build invariant: the deck must depend on the
      # samples it transcludes, or the "slides are a build artifact" thesis
      # is just narration.
      - name: Self-build invariant (//slides depends on //samples)
        run: |
          path=$(bazel query 'somepath(//slides:srcs, //samples/python:app.py)')
          echo "$path"
          test -n "$path"

      # TASK §5.4 — reproducibility: the same inputs must yield the same OCI
      # image digest (content-addressable, not a daemon snapshot).
      - name: Reproducible image digest
        run: |
          # Read the digest from the `digest` output group, not from a path
          # under bazel-bin/samples/python/image/ — rules_img writes no such
          # directory, so the old sha256sum silently failed and compared two
          # empty strings, i.e. the check passed no matter what.
          bazel build //samples/python:image --output_groups=digest
          a=$(cat bazel-bin/samples/python/image_digest)
          bazel clean
          bazel build //samples/python:image --output_groups=digest
          b=$(cat bazel-bin/samples/python/image_digest)
          echo "digest A=$a"
          echo "digest B=$b"
          test -n "$a"
          test "$a" = "$b"

  # The local-infrastructure labs (labs/remote/README.md). Neither of these paths had
  # any test coverage before: the registry was a docs-only workflow, and the
  # remote-cache material pointed at a hosted service nobody could run in CI.
  # Both now run from pinned static binaries, so this job needs no services.
  remote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Same reason as the `bazel` job above: the images do not fit on a
      # stock runner next to a disk cache, and overflowing kills it silently.
      - name: Make room on the runner
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/.ghcup /usr/share/swift
          echo "build --disk_cache=" >> ~/.bazelrc
          df -h /

      - name: The cache actually serves hits
        run: |
          set -euo pipefail
          bazel run //tools:local_cache
          bazel build --config=local-cache //samples/python:image   # cold: upload
          bazel clean
          # Everything local is gone, so any hit here came off the wire.
          bazel build --config=local-cache //samples/python:image 2>&1 \
            | tee /tmp/warm.log
          grep -q "remote cache hit" /tmp/warm.log

      - name: Building without the bytes really skips the bytes
        run: |
          set -euo pipefail
          # Populate the cache for THIS target first. The tarball action runs
          # locally, so unless its own result is already a cache hit Bazel has
          # to stage every layer byte as an input and the measurement below is
          # meaningless. labs/remote gets this for free: its §1 builds
          # //samples/... — which includes :image.tar — before §2 measures.
          bazel build --config=local-cache //samples/python:image.tar
          bazel clean
          bazel build --config=local-bwb //samples/python:image.tar
          # ~82 MB with a normal build; a few hundred KB without the bytes.
          bytes=$(du -sb bazel-out/k8-fastbuild/bin/samples/python | cut -f1)
          echo "bazel-out/.../samples/python = $bytes bytes"
          test "$bytes" -lt 10000000

      - name: Push to the hermetic registry, and dedup on the second push
        run: |
          set -euo pipefail
          bazel run //tools:local_registry -- --hermetic
          bazel run //samples/python:push
          curl -fsS http://localhost:5000/v2/bwb/python-graphviz/tags/list \
            | tee /dev/stderr | grep -q latest
          # Same inputs -> same image -> the registry already has every blob.
          bazel run //samples/python:push 2>&1 | tee /tmp/push2.log
          grep -q "blob transfers" /tmp/push2.log

      # labs/remote task 5: a registry is also a way to READ an image, with no
      # daemon. The Python sample ships no `dot` (the ghost), so export has none.
      - name: Read the pushed image back with crane
        run: |
          set -euo pipefail
          bazel run //tools:crane_cli -- manifest localhost:5000/bwb/python-graphviz:latest \
            | tee /dev/stderr | grep -q '"layers"'
          n=$(bazel run //tools:crane_cli -- export localhost:5000/bwb/python-graphviz:latest - \
                | tar tf - | grep -c bin/dot || true)
          echo "bin/dot entries: $n"
          test "$n" = 0

      # Lazy push needs a remote CACHE, not remote execution: the push tool
      # streams layer blobs straight out of the CAS. After a clean there are no
      # local outputs, so every blob must come from the cache, none from disk.
      - name: Lazy push streams blobs from the remote cache
        run: |
          set -euo pipefail
          bazel clean
          bazel run --config=local-bwb \
            --@rules_img//img/settings:remote_cache=grpc://localhost:9092 \
            //samples/python:push_lazy -- --registry localhost:5000 2>&1 \
            | tee /tmp/lazy.log
          grep -qE "blob transfers: 0 from disk, .*[1-9][0-9]* from remote cache" /tmp/lazy.log
          curl -fsS http://localhost:5000/v2/bwb-graphviz/tags/list \
            | tee /dev/stderr | grep -q 1h

      - name: Tear down
        if: always()
        run: |
          bazel run //tools:local_cache -- stop || true
          bazel run //tools:local_registry -- stop || true

  # Every command on the slides is copy-pasted by a room of attendees, so run
  # them: README.md's setup first (the deck assumes it), then each ```bash line
  # of slides/slides.md in slide order, verbatim — no hand-copied duplicates to
  # drift. `$ ` transcripts and ```console blocks get the static check only
  # (every label and --config exists). Pushes go to ttl.sh, as on the slides.
  slide-commands:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Same reason as the `bazel` job above.
      - name: Make room on the runner
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/.ghcup /usr/share/swift
          echo "build --disk_cache=" >> ~/.bazelrc
          df -h /

      - name: Every slide command works
        run: python3 labs/ci/labs_ci.py slides --run

  # Remote EXECUTION on a local Buildfarm (labs/remote/README.md §4). Needs
  # Docker, which hosted runners have. Two contracts:
  #   1. the documented subset really executes remotely, and passes;
  #   2. the documented hermeticity bug behaves as documented. Apt-layer
  #      targets compile `gawk` with the C++ toolchain Bazel autodetected on
  #      THIS host, but the worker runs its own gcc. Same gcc major on both
  #      (e.g. an Ubuntu 24.04 runner vs the 24.04 worker): it passes, by
  #      coincidence. Different: "absolute path inclusion". A hermetic
  #      toolchain would make it pass everywhere; then update the lab.
  rbe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Make room on the runner
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/.ghcup /usr/share/swift
          echo "build --disk_cache=" >> ~/.bazelrc
          df -h /

      - name: Start Buildfarm
        run: bazel run //tools:local_rbe

      - name: The documented subset runs remotely and passes
        run: |
          set -euo pipefail
          bazel test --config=local-rbe //samples/python/... //labs/playground/... \
            2>&1 | tee /tmp/rbe.log
          # Cache hits alone would also pass; require actions that ran on the worker.
          grep -qE "processes: .*[1-9][0-9]* remote[,.]" /tmp/rbe.log

      - name: The host-toolchain bug behaves as documented
        run: |
          set -uo pipefail
          host=$(gcc -dumpversion | cut -d. -f1)
          worker=$(docker exec bwb-rbe-worker gcc -dumpversion | cut -d. -f1)
          echo "host gcc $host, worker gcc $worker"
          bazel build --config=local-rbe //samples/distroless:image > /tmp/apt.log 2>&1
          rc=$?
          tail -20 /tmp/apt.log
          if [ "$host" = "$worker" ]; then
            test "$rc" = 0 || { echo "::error::same gcc on host and worker, yet the apt layer failed remotely"; exit 1; }
          else
            if [ "$rc" = 0 ]; then
              echo "::error::gcc $host (host) vs $worker (worker) built fine — a hermetic toolchain? update labs/remote/README.md §4"
              exit 1
            fi
            grep -q "absolute path inclusion" /tmp/apt.log
          fi

      - name: Buildfarm logs on failure
        if: failure()
        run: docker compose -f tools/rbe/docker-compose.yml logs --tail=200 || true

      - name: Tear down
        if: always()
        run: bazel run //tools:local_rbe -- stop || true

  slides:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Build the deck (transclusion must resolve)
        working-directory: slides
        run: |
          npm ci
          npx slidev build --out dist

      # `npm ci` above resolves package-lock.json; `npm_translate_lock` in
      # MODULE.bazel resolves the committed pnpm-lock.yaml. Dependabot only ever
      # updates the first, so without this a dependency bump lands in the npm
      # build and silently leaves Bazel pinned to the old — vulnerable — versions,
      # with both jobs still green. Re-derive the pnpm lock and fail if it drifted.
      - name: The two lockfiles must agree
        run: |
          bazel run -- @pnpm//:pnpm --dir "$PWD/slides" import
          git diff --exit-code -- slides/pnpm-lock.yaml || {
            echo "::error file=slides/pnpm-lock.yaml::Stale pnpm lock. Re-run: bazel run -- @pnpm//:pnpm --dir \"\$PWD/slides\" import"
            exit 1
          }

      # The repo's thesis is that the deck is a build artifact of the same graph
      # that builds the images — so the *Bazel* deck build has to stay covered.
      # It lives here rather than in the `bazel` job because this is the job that
      # already has a reason to download a Node toolchain.
      - name: Build the deck hermetically, through Bazel
        run: bazel build //slides:build
