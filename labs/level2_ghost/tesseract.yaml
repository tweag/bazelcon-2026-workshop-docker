# Debian packages for the hermetic `tesseract` layer (Level 2 — the "ghost").
# pytesseract is pure Python; the real engine is this apt binary + its language
# data. We materialize both as a pinned, content-addressed layer.
#
# Regenerate the lockfile after any change:
#   bazel run @tesseract_apt//:lock
#
# Pinned to the same Debian snapshot as the graphviz sample for reproducibility.
version: 1

sources:
  - channel: bookworm main
    urls:
      - https://snapshot-cloudflare.debian.org/archive/debian/20240210T223313Z
      - https://snapshot.debian.org/archive/debian/20240210T223313Z

archs:
  - "amd64"
  - "arm64"

packages:
  - "tesseract-ocr"       # the `tesseract` binary + libtesseract + leptonica
  - "tesseract-ocr-eng"   # English traineddata (the runtime data dependency)
