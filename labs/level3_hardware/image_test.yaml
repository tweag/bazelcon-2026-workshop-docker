# Level 3 checks (tar driver, daemonless). Paths are amd64 (arm64: aarch64-linux-gnu).
schemaVersion: "2.0.0"

fileExistenceTests:
  - name: "OpenCL ICD loader (libOpenCL) is bundled"
    path: "/usr/lib/x86_64-linux-gnu/libOpenCL.so.1"
    shouldExist: true
  - name: "POCL CPU ICD is registered"
    path: "/etc/OpenCL/vendors/pocl.icd"
    shouldExist: true
