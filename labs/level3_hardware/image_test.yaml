# Level 3 checks (tar driver, daemonless). Shared by the skeleton and solution/.
# The library's path depends on the CPU: image_test_<cpu>.yaml.
schemaVersion: "2.0.0"

fileExistenceTests:
  # pyopencl's own loader (bundled in its wheel) reads this to find a device.
  - name: "POCL CPU ICD is registered"
    path: "/etc/OpenCL/vendors/pocl.icd"
    shouldExist: true
