# Debian packages for a CPU-only OpenCL stack (Level 3): no host GPU driver needed.
# Re-lock after any change: bazel run @pocl_apt//:lock
version: 1

sources:
  - channel: bookworm main
    urls:
      - https://snapshot-cloudflare.debian.org/archive/debian/20240210T223313Z
      - https://snapshot.debian.org/archive/debian/20240210T223313Z

archs:
  - "amd64"
  - "arm64"

packages:
  - "ocl-icd-libopencl1"   # the ICD loader -> libOpenCL.so.1
  - "pocl-opencl-icd"      # the CPU OpenCL implementation + /etc/OpenCL/vendors
